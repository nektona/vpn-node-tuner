<text x="22" y="224" xml:space="preserve"><tspan class="h">   3)  </tspan><tspan class="l">🎚️ Change RAM profile</tspan></text>
<text x="22" y="245" xml:space="preserve"><tspan class="h">   4)  </tspan><tspan class="l">🧪 Test mode </tspan><tspan class="p">(nothing written to disk)</tspan></text>

