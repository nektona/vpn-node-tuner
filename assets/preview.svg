<text x="22" y="161" xml:space="preserve"><tspan class="h">🔧 Tuning:</tspan></text>
<text x="22" y="182" xml:space="preserve"><tspan class="h">   1)  </tspan><tspan class="l">🚀 Apply optimization </tspan><tspan class="p">(profile 2g)</tspan></text>
