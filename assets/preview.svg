<svg xmlns="http://www.w3.org/2000/svg" width="640" height="585" viewBox="0 0 640 585" role="img" aria-label="vpntune — VPN Node Tuner">
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13.5px; }
