name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: bash -n vpn-node-tuner.sh

      - name: Lint
        run: shellcheck --severity=warning vpn-node-tuner.sh
